<section id="programs">
  <div class="cs-programs__hero cs-section-hero">
    <div class="container">
      <span class="section-label">Líneas de acción</span>
      <h1 class="cs-programs__title">Programas</h1>
    </div>
  </div>

  <div class="cs-programs__body cs-section-body">
    <div class="container">
      <ol class="cs-programs__list">
        <li
          class="cs-programs__item"
          *ngFor="let category of categories; let i = index">
          <a class="cs-programs__link" [routerLink]="['categoria', category.codigo]">
            <span class="cs-programs__index">{{ (i + 1) | number:'2.0-0' }}</span>
            <div class="cs-programs__content">
              <div class="cs-programs__header">
                <h2 class="cs-programs__name">{{category.nombre}}</h2>
                <span
                  class="cs-badge--new"
                  *ngIf="shouldShowBadge(category)"
                  aria-label="Nueva información disponible">
                  Nueva información
                </span>
              </div>
              <p class="cs-programs__desc">{{category.descripcion}}</p>
            </div>
            <div class="cs-programs__icon">
              <i class="{{category.logo}}" aria-hidden="true"></i>
            </div>
            <span class="cs-programs__arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ol>
    </div>
  </div>
</section>
