<!-- Header section-->
<section id="header">
  <header>
    <!-- Menu section-->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="#header">
          <span class="brand-name">CORPOSURGIR21</span>
          <span class="brand-subtitle">Corporación para el Desarrollo Humano y Ambiental</span>
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          <div class="menu-user ms-auto" *ngIf="!isAuthenticated">
            <ul class="navbar-nav align-items-center">
              <li class="nav-item">
                <a class="nav-link" href="#about">QUIÉNES SOMOS</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#programs">LÍNEAS DE ACCIÓN</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#proyectos">PROYECTOS</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#alliance">ALIANZAS</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#transparencia">TRANSPARENCIA</a>
              </li>
              <li class="nav-item">
                <a class="btn btn-contacto" href="#contacto">CONTACTO</a>
              </li>
            </ul>
          </div>
          
          <div class="menu-admin ms-auto" *ngIf="isAuthenticated">
            <ul class="navbar-nav align-items-center">
              <li class="nav-item">
                <a class="nav-link" [routerLink]="['/modulo-administracion']">Principal</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  {{nombre}}
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><button (click)="logout()" class="dropdown-item" type="button">Salir</button></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
    <!-- End Menu section-->
  </header>
  <!-- End Header section-->
</section>
