<section id="header">
  <nav class="cs-navbar fixed-top" role="navigation" aria-label="Menú principal">
    <div class="cs-navbar__inner">
      <a class="cs-navbar__brand" href="#hero">
        <img src="./assets/img/corposurgirLogo.png" alt="CORPOSURGIR21" class="cs-navbar__logo">
      </a>
      
      <button 
        class="navbar-toggler cs-navbar__toggler" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#navbarNav" 
        aria-controls="navbarNav" 
        aria-expanded="false" 
        aria-label="Abrir menú de navegación">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>

      <div class="cs-navbar__collapse collapse" id="navbarNav">
        <div class="cs-navbar__menu" *ngIf="!isAuthenticated">
          <a class="cs-navbar__link" href="#hero">Inicio</a>
          <a class="cs-navbar__link" href="#about">Quiénes somos</a>
          <a class="cs-navbar__link" href="#programs">Líneas de acción</a>
          <a class="cs-navbar__link" href="#alliance">Alianzas</a>
          <a class="cs-navbar__link" href="/contactanos">Contacto</a>
          <a class="cs-navbar__link cs-navbar__link--cta" href="/login">Ingresar</a>
        </div>

        <div class="cs-navbar__menu cs-navbar__menu--admin" *ngIf="isAuthenticated">
          <a class="cs-navbar__link" routerLinkActive="active" [routerLink]="['/modulo-administracion']">Principal</a>
          <div class="cs-navbar__dropdown">
            <button 
              class="cs-navbar__dropdown-toggle" 
              type="button" 
              data-bs-toggle="dropdown" 
              aria-expanded="false" 
              aria-haspopup="true">
              {{nombre}}
            </button>
            <ul class="cs-navbar__dropdown-menu" role="menu">
              <li>
                <button (click)="logout()" class="cs-navbar__dropdown-item" type="button">Salir</button>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>
</section>
