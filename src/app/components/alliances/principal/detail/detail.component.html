<div class="cs-alliance-detail" *ngIf="alliances">
  <div class="cs-alliance-detail__hero cs-section-hero">
    <div class="container">
      <a routerLink="/alliances" class="cs-alliance-detail__back">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        <span>Volver a alianzas</span>
      </a>
      <div class="cs-alliance-detail__header">
        <span class="section-label">Alianzas</span>
        <h1 class="cs-alliance-detail__title">{{alliances.nombre | uppercase}}</h1>
        <p class="cs-alliance-detail__desc">{{alliances.descripcion}}</p>
        <a 
          class="btn-cs-outline" 
          [href]="alliances.pagina_web" 
          role="button" 
          [attr.aria-disabled]="disabled"
          target="_blank" 
          rel="noopener noreferrer"
          *ngIf="alliances.pagina_web">
          Visitar sitio web
        </a>
      </div>
    </div>
  </div>

  <div class="cs-alliance-detail__body cs-section-body">
    <div class="container">
      <div class="row gx-lg-5">
        <div class="col-lg-3">
          <div class="cs-alliance-detail__logo-box">
            <img
              class="cs-alliance-detail__logo"
              src="{{alliances.ruta_imagen}}"
              alt="{{alliances.nombre}}">
          </div>
        </div>

        <div class="col-lg-8 offset-lg-1">
          <h2 class="cs-alliance-detail__section-title">Características</h2>

          <div class="cs-alliance-detail__features">
            <article
              class="cs-alliance-detail__feature"
              *ngFor="let caracteristica of alliances.caracteristicas">
              <div class="cs-alliance-detail__feature-icon">
                <i class="bi bi-patch-check" aria-hidden="true"></i>
              </div>
              <div class="cs-alliance-detail__feature-body">
                <h3 class="cs-alliance-detail__feature-name">{{caracteristica.nombre_caracteristica}}</h3>
                <p class="cs-alliance-detail__feature-desc">{{caracteristica.descripcion}}</p>
              </div>
            </article>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
